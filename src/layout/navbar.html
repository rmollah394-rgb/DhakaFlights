<header data-section="navbar" class="bg-transparent text-white relative z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-4">

    <!-- Logo -->

      <img src="/mydhakaflightslogo.png" alt="DhakaFlights.com Logo" data-logo-img
        class="h-12 sm:h-16 w-auto object-contain shrink-0 max-h-16" />
      <svg data-logo-fallback class="hidden w-9 h-9 shrink-0" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M6 19.5L19.5 6H32C33.1 6 34 6.9 34 8V20.5L20.5 34C19.7 34.8 18.4 34.8 17.6 34L6 22.4C5.2 21.6 5.2 20.3 6 19.5Z" stroke="#FFD200" stroke-width="2.6" stroke-linejoin="round"/>

        <path d="M13 22L24 16L19 25L17 22L13 22Z" fill="#FFD200"/>
      </svg>
      <div class="leading-tight">
        <div class="text-lg sm:text-2xl font-extrabold tracking-tight">
          DhakaFlights<span class="font-bold opacity-90">.com</span>
        </div>
        <div class="text-[11px] font-semibold opacity-80 hidden sm:block">
          Fly Smart. Travel Better.
        </div>
      </div>
    </a>

    <!-- Desktop Navigation -->

        <svg width="16" height="16" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>

          <svg width="14" height="14" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>

        <div id="dfMenuFlights" data-df-menu class="hidden group-hover:block absolute left-0 top-full pt-2 w-56 z-50">

            <a href="/#search" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition">
              <svg width="16" height="16" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>

              <svg width="16" height="16" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z"/><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z"/></svg>
              <span>Popular Flight Deals</span>
            </a>
          </div>
        </div>
      </div>

      <a href="/about" class="py-2 hover:opacity-80 transition">About</a>

      <!-- Help Dropdown -->
      <div class="relative group" data-df-dropdown>
        <button type="button" data-dropdown-btn="dfMenuHelp" aria-expanded="false" aria-haspopup="true"
          class="inline-flex items-center gap-1.5 py-2 hover:opacity-80 transition">
          <span>Help</span>
          <svg width="14" height="14" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">

        </button>
        <div id="dfMenuHelp" data-df-menu class="hidden group-hover:block absolute left-0 top-full pt-2 w-52 z-50">
          <div class="bg-white text-slate-900 border border-slate-200 rounded-2xl shadow-xl p-2 text-xs font-bold space-y-0.5">

              <svg width="16" height="16" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>

            <a href="/terms" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition">
              <svg width="16" height="16" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>

      <a href="/contact" class="py-2 hover:opacity-80 transition">Contact</a>

    <!-- Right Controls -->
    <div class="flex items-center gap-2.5 shrink-0">
      <button type="button" data-action="open-alert"
        class="inline-flex items-center gap-2 border border-white/30 hover:bg-white/10 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition">
        <svg width="16" height="16" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
        </svg>
        <span class="hidden sm:inline">Price Alerts</span>
      </button>

      <button type="button" data-mobile-toggle aria-label="Open menu" aria-expanded="false"
        class="md:hidden w-9 h-9 rounded-xl border border-white/30 flex items-center justify-center hover:bg-white/10 transition">
        <svg width="20" height="20" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>

    <a href="/" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">Home</a>
    <a href="/dhaka-flights-today" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">Live DAC Airport Board</a>
    <a href="/#calendar" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">Lowest Fare Calendar</a>
    <a href="/#deals" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">Popular Flight Deals</a>
    <a href="/guides" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">Travel Guides</a>
    <a href="/about" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">About</a>
    <a href="/contact" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-slate-100">Contact</a>
