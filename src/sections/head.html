  <!-- JS ক্র্যাশ প্রিভেনশন: app.js থেকে BDT/USD সরালে যেন এরর না দেয় -->

  </div>

  <script>
    (function () {
      window.dfToggleHeaderMenu = function (menuId, btn) {
        var target = document.getElementById(menuId);
        if (!target) return;
        var isHidden = target.classList.contains('hidden');
        document.querySelectorAll('[data-df-menu]').forEach(function (el) {
          el.classList.add('hidden');
        });
        if (isHidden) {
          target.classList.remove('hidden');
          if (btn) btn.setAttribute('aria-expanded', 'true');
        } else if (btn) {
          btn.setAttribute('aria-expanded', 'false');
        }
      };

      window.dfToggleMobileNav = function (btn) {
        var nav = document.getElementById('dfMobileNav');
        if (!nav) return;
        var open = nav.classList.toggle('hidden') === false;
        if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };

      document.addEventListener('click', function (e) {
        if (!e.target.closest('[data-df-dropdown]')) {
          document.querySelectorAll('[data-df-menu]').forEach(function (el) {
            el.classList.add('hidden');
          });
        }
      });
    })();
  </script>
