{{ANNOUNCEMENT_BAR}}

<div class="max-w-[1560px] mx-auto px-3 sm:px-6 lg:px-10 pt-3 sm:pt-4">
  <section id="search" data-section="hero-search"
    class="sky-hero text-white relative z-30 pb-14 sm:pb-20 rounded-[28px] sm:rounded-[38px] shadow-[0_16px_45px_rgba(0,38,92,0.18)]">

    <!-- Background Image Layer -->
    <div class="absolute inset-0 rounded-[28px] sm:rounded-[38px] overflow-hidden pointer-events-none z-0">
      <img src="/hero-bg.jpg" alt="" aria-hidden="true" data-hero-bg-img
        class="w-full h-full object-cover object-center" />
      <div data-hero-bg-overlay class="absolute inset-0 bg-linear-to-r from-[#00265c]/75 via-[#003a8c]/45 to-[#003a8c]/15"></div>
    </div>

    {{NAVBAR}}

    <!-- Hero Title & Search Form -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-10 sm:pt-14 relative z-20">
      <div class="max-w-2xl mb-7">
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-[1.12] drop-shadow-xs">
          {{HERO_TITLE}}
        </h1>
        <p class="text-blue-100 text-sm sm:text-base mt-3">
          {{HERO_SUBTITLE}}
        </p>
      </div>

      <div class="flex items-center gap-6 mb-3 pl-1">
        <button type="button" data-trip-btn="round"
          class="pb-2 text-sm sm:text-base font-bold text-white border-b-2 border-[#FFD200] transition">
          Round-Trip
        </button>
        <button type="button" data-trip-btn="oneway"
          class="pb-2 text-sm sm:text-base font-bold text-white/75 hover:text-white border-b-2 border-transparent transition">
          One-Way
        </button>
      </div>

      <!-- Separate backdrop-blur layer prevents CSS stacking-context trap -->
      <div class="relative rounded-2xl p-3 sm:p-4 shadow-2xl border border-white/15">
        <div aria-hidden="true" class="absolute inset-0 bg-[#05234d]/45 backdrop-blur-md rounded-2xl pointer-events-none"></div>

        <form data-search-form class="relative z-10" novalidate>
          <div class="grid grid-cols-1 lg:grid-cols-[1.2fr_1.2fr_1.05fr_0.95fr_145px] bg-white text-slate-900 rounded-xl shadow-lg divide-y lg:divide-y-0 lg:divide-x divide-slate-200 relative">

            <!-- FROM -->
            <div class="relative px-4 py-3">
              <label for="originInput" class="block text-[11px] font-semibold text-slate-500">From</label>
              <input type="text" id="originInput" data-airport-input="origin" autocomplete="off"
                value="Dhaka, Bangladesh (DAC)"
                class="w-full text-sm sm:text-[15px] font-bold text-slate-900 bg-transparent focus:outline-none truncate pr-6"
                placeholder="Origin city or code" required />
              <input type="hidden" id="originCode" value="DAC" />
              <div data-airport-list="origin"
                class="hidden autocomplete-list absolute left-0 right-0 top-full mt-2 bg-white border border-slate-200 rounded-xl shadow-2xl z-50"></div>

              <button type="button" data-swap-btn title="Swap airports"
                class="w-9 h-9 rounded-full bg-[#0a3673] hover:bg-[#082a59] text-white ring-4 ring-white shadow-md flex items-center justify-center absolute right-4 -bottom-4 lg:bottom-auto lg:right-0 lg:top-1/2 lg:-translate-y-1/2 lg:translate-x-1/2 z-20 transition hover:scale-105">
                <svg width="16" height="16" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                </svg>
              </button>
            </div>

            <!-- TO -->
            <div class="relative px-4 lg:pl-6 py-3">
              <label for="destInput" class="block text-[11px] font-semibold text-slate-500">To</label>
              <div class="flex items-center">
                <input type="text" id="destInput" data-airport-input="dest" autocomplete="off"
                  value="Dubai, UAE (DXB)"
                  class="w-full text-sm sm:text-[15px] font-bold text-slate-900 bg-transparent focus:outline-none truncate"
                  placeholder="Search for an airport or city" required />
                <button type="button" data-clear-dest title="Clear destination"
                  class="text-slate-400 hover:text-slate-600 text-xs font-bold px-1">✕</button>
              </div>
              <input type="hidden" id="destCode" value="DXB" />
              <div data-airport-list="dest"
                class="hidden autocomplete-list absolute left-0 right-0 top-full mt-2 bg-white border border-slate-200 rounded-xl shadow-2xl z-50"></div>
            </div>

            <!-- DATES -->
            <div class="relative px-4 py-3">
              <button type="button" data-popover-trigger="date" class="w-full text-left focus:outline-none">
                <span class="block text-[11px] font-semibold text-slate-500">Dates</span>
                <span data-dates-display class="block text-sm sm:text-[15px] font-bold text-slate-900 truncate">Loading...</span>
              </button>

              <div data-popover="date"
                class="hidden absolute left-0 lg:left-auto lg:right-0 top-full mt-2 w-72 sm:w-80 max-w-[calc(100vw-2rem)] bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 z-50 text-slate-800">
                <div class="space-y-3">
                  <div>
                    <label for="departDate" class="block text-xs font-bold text-slate-600 mb-1">Departure Date</label>
                    <input type="date" id="departDate" required
                      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-600 focus:outline-none" />
                  </div>
                  <div data-return-wrap>
                    <label for="returnDate" class="block text-xs font-bold text-slate-600 mb-1">Return Date</label>
                    <input type="date" id="returnDate"
                      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-600 focus:outline-none" />
                  </div>
                  <div class="flex items-center justify-between pt-1 gap-2">
                    <button type="button" data-quick-trip="7" class="text-xs bg-slate-100 hover:bg-blue-50 text-slate-700 font-semibold px-2.5 py-1.5 rounded-lg">1 Week</button>
                    <button type="button" data-quick-trip="14" class="text-xs bg-slate-100 hover:bg-blue-50 text-slate-700 font-semibold px-2.5 py-1.5 rounded-lg">2 Weeks</button>
                    <button type="button" data-popover-close="date" class="ml-auto bg-[#0a3673] text-white text-xs font-bold px-4 py-1.5 rounded-lg">Apply</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- TRAVELERS & CABIN -->
            <div class="relative px-4 py-3">
              <button type="button" data-popover-trigger="pax" class="w-full text-left focus:outline-none">
                <span class="block text-[11px] font-semibold text-slate-500">Travelers &amp; Cabin class</span>
                <span data-pax-display class="block text-sm sm:text-[15px] font-bold text-slate-900 truncate">1 Adult, Economy</span>
              </button>

              <div data-popover="pax"
                class="hidden absolute right-0 top-full mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 z-50 space-y-3 text-slate-800">
                <div class="flex items-center justify-between">
                  <div><div class="font-bold text-sm">Adults</div><div class="text-xs text-slate-400">12+ years</div></div>
                  <div class="flex items-center gap-2.5">
                    <button type="button" data-pax-btn="adults:-1" class="w-7 h-7 rounded-full border border-slate-300 font-bold hover:bg-slate-100">-</button>
                    <span data-pax-count="adults" class="w-4 text-center font-bold text-sm">1</span>
                    <button type="button" data-pax-btn="adults:1" class="w-7 h-7 rounded-full border border-slate-300 font-bold hover:bg-slate-100">+</button>
                  </div>
                </div>
                <div class="flex items-center justify-between">
                  <div><div class="font-bold text-sm">Children</div><div class="text-xs text-slate-400">2–11 years</div></div>
                  <div class="flex items-center gap-2.5">
                    <button type="button" data-pax-btn="children:-1" class="w-7 h-7 rounded-full border border-slate-300 font-bold hover:bg-slate-100">-</button>
                    <span data-pax-count="children" class="w-4 text-center font-bold text-sm">0</span>
                    <button type="button" data-pax-btn="children:1" class="w-7 h-7 rounded-full border border-slate-300 font-bold hover:bg-slate-100">+</button>
                  </div>
                </div>
                <div class="flex items-center justify-between">
                  <div><div class="font-bold text-sm">Infants</div><div class="text-xs text-slate-400">Under 2 years</div></div>
                  <div class="flex items-center gap-2.5">
                    <button type="button" data-pax-btn="infants:-1" class="w-7 h-7 rounded-full border border-slate-300 font-bold hover:bg-slate-100">-</button>
                    <span data-pax-count="infants" class="w-4 text-center font-bold text-sm">0</span>
                    <button type="button" data-pax-btn="infants:1" class="w-7 h-7 rounded-full border border-slate-300 font-bold hover:bg-slate-100">+</button>
                  </div>
                </div>
                <div class="pt-2 border-t border-slate-100">
                  <label for="cabinClass" class="block text-xs font-bold text-slate-500 mb-1">Cabin Class</label>
                  <select id="cabinClass" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold">
                    <option value="">Economy</option>
                    <option value="w">Premium Economy</option>
                    <option value="c">Business Class</option>
                    <option value="f">First Class</option>
                  </select>
                </div>
                <button type="button" data-popover-close="pax" class="w-full bg-[#0a3673] text-white py-2 rounded-lg text-sm font-bold">Done</button>
              </div>
            </div>

            <button type="submit"
              class="bg-[#FFD200] hover:bg-[#f2c600] text-slate-900 font-extrabold text-base py-4 lg:py-0 px-6 rounded-b-xl lg:rounded-bl-none lg:rounded-r-xl transition flex items-center justify-center">
              Search
            </button>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3 pt-3 px-1 text-xs sm:text-sm font-medium text-white/95">
            <div class="flex flex-wrap items-center gap-5">
              <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" data-direct-toggle class="w-4 h-4 rounded border-white/40 accent-[#FFD200]" />
                <span>Direct Flights</span>
              </label>
              <a href="#calendar" class="inline-flex items-center gap-1.5 text-blue-100 hover:text-[#FFD200] transition">
                <span>When-to-Fly Calendar</span>
              </a>
            </div>

            <button type="button" data-action="open-alert" class="inline-flex items-center gap-2.5 group">
              <span class="w-9 h-5 bg-white/25 group-hover:bg-[#FFD200]/80 rounded-full p-0.5 flex items-center transition">
                <span class="w-4 h-4 bg-white rounded-full shadow-xs transition transform"></span>
              </span>
              <span class="group-hover:text-[#FFD200] transition">Sign up for best flight deals</span>
            </button>
          </div>

          <p data-form-error class="hidden bg-red-500/90 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg mt-3"></p>
        </form>
      </div>
    </div>
  </section>
</div>
