<div id="alertModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl relative">
    <button type="button" onclick="closeAlertModal()" class="absolute right-5 top-5 text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>
    <div class="w-11 h-11 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl mb-3">🔔</div>
    <h3 class="text-xl font-extrabold text-slate-900">Get Flight Price Drop Alerts</h3>
    <p class="text-sm text-slate-500 mt-1 mb-5">We will notify you when fares drop for your favorite Dhaka route.</p>

    <form onsubmit="submitAlert(event)" class="space-y-3.5">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">From</label>
          <input type="text" id="alertOrigin" value="DAC" maxlength="3" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-bold uppercase" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">To</label>
          <input type="text" id="alertDest" value="DXB" maxlength="3" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-bold uppercase" />
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Your Email Address</label>
        <input type="email" id="alertEmail" placeholder="you@example.com" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-600 focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Target Max Budget (Optional)</label>
        <input type="number" id="alertBudget" placeholder="e.g. 42000 BDT" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium" />
      </div>
      <button type="submit" id="alertSubmitBtn" class="w-full bg-[#FFD200] hover:bg-[#f2c600] text-slate-900 font-extrabold py-3 rounded-xl transition">
        Activate Free Price Alert
      </button>
      <p id="alertMsg" class="hidden text-xs font-bold text-center pt-1"></p>
    </form>
  </div>
</div>
